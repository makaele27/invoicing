<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mallo Invoicing</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="sidebar w-56 flex-shrink-0 hidden lg:flex flex-col">
    <div class="sidebar-brand">
      <img src="assets/logo-white-wordmark.png" alt="Mallo" />
    </div>
    <div style="margin-top:2px;">
      <div class="group-title">Workspace</div>
      <nav class="px-2" id="navMain">
        <a data-route="#/dashboard">
          <i data-lucide="layout-dashboard" width="15" height="15"></i>
          Dashboard
          <span id="badgeInvoices" class="badge" style="display:none"></span>
        </a>
        <a data-route="#/invoices">
          <i data-lucide="file-text" width="15" height="15"></i>
          Invoices
        </a>
        <a data-route="#/clients">
          <i data-lucide="users" width="15" height="15"></i>
          Clients
        </a>
        <a data-route="#/products">
          <i data-lucide="package" width="15" height="15"></i>
          Products
        </a>
      </nav>
      <div class="group-title">System</div>
      <nav class="px-2">
        <a data-route="#/settings">
          <i data-lucide="settings" width="15" height="15"></i>
          Settings
        </a>
        <a data-route="#/backup">
          <i data-lucide="database" width="15" height="15"></i>
          Backup
        </a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <div>v1.1 · Local-first</div>
      <div id="userBadge" style="margin-top:2px;"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 min-w-0 flex flex-col">
    <header id="topbar" class="sticky top-0 z-20">
      <div>
        <div id="crumb"></div>
        <div id="pageTitle">Dashboard</div>
      </div>
      <div class="flex items-center gap-2" id="topActions"></div>
    </header>

    <div id="view" class="flex-1"></div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-backdrop" onclick="UI.closeModal()"></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button onclick="UI.closeModal()" style="background:none;border:none;cursor:pointer;color:var(--color-cappuccino);font-size:20px;line-height:1;">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/invoices.js"></script>
<script src="js/views/editor.js"></script>
<script src="js/views/preview.js"></script>
<script src="js/views/clients.js"></script>
<script src="js/views/products.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/backup.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
<script>
  // Init Lucide icons after DOM ready
  document.addEventListener('DOMContentLoaded', () => {
    if (window.lucide) lucide.createIcons();
  });
  // Re-render icons whenever view updates
  const _origSetInner = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  // Re-init after each route render
  const _lucideRefresh = () => { if (window.lucide) lucide.createIcons(); };
  document.addEventListener('routeRendered', _lucideRefresh);
</script>
</body>
</html>
